name: Version and release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Optional manual version bump (first release uses VERSION)
        type: choice
        default: none
        options: [none, patch, minor, major]
      dry_run:
        description: Validate and preview only; do not push a version, tag or release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: semantic-release-main
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ github.sha }}

  version:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.initial.outputs.tag || steps.semantic.outputs.tag }}
      released: ${{ steps.initial.outputs.released || steps.semantic.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Release only the tested main commit
        id: guard
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$TESTED_SHA" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Newer commits are on main; their own successful pipeline will release them."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.guard.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Inspect existing release baseline
        id: baseline
        if: steps.guard.outputs.ready == 'true'
        run: python scripts/release.py inspect --github-output "$GITHUB_OUTPUT"
      - name: Create the first version tag after validation
        id: initial
        if: steps.guard.outputs.ready == 'true' && steps.baseline.outputs.initial == 'true'
        env:
          RELEASE_TAG: ${{ steps.baseline.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = true ]; then
            echo "Would create initial release $RELEASE_TAG at $(git rev-parse HEAD)."
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name github-actions
            git config user.email actions@users.noreply.github.com
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Conventional Commit version and changelog
        id: semantic
        if: steps.guard.outputs.ready == 'true' && steps.baseline.outputs.initial == 'false'
        uses: python-semantic-release/python-semantic-release@v10.6.2
        with:
          config_file: release.toml
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions
          git_committer_email: actions@users.noreply.github.com
          force: ${{ inputs.force != 'none' && inputs.force || '' }}
          no_operation_mode: ${{ inputs.dry_run || false }}
          vcs_release: false
          build: false

  # GITHUB_TOKEN-created tags do not trigger push workflows. Call publication
  # directly instead of relying on a second tag event or a personal token.
  publish:
    needs: version
    if: needs.version.outputs.released == 'true' && !inputs.dry_run
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.version.outputs.tag }}
      dry_run: false
